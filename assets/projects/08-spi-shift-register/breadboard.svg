<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1196"
     role="img" aria-labelledby="title desc">
  <title id="title">SPI-Like Shift Register: Breadboard connection map</title>
  <desc id="desc">Connection map; physical hole positions vary by breadboard. Verify every rail.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    .title { font: 700 28px system-ui; fill: #0a1220; }
    .sub { font: 16px system-ui; fill: #334155; }
    .section { font: 700 18px system-ui; fill: #0f172a; }
    .label { font: 14px ui-monospace, monospace; fill: #0f172a; }
    .tp { font: 700 13px ui-monospace, monospace; fill: #b45309; }
    .warn { font: 13px system-ui; fill: #b45309; }
    .box { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="35" y="45" class="title">SPI-Like Shift Register</text>
  <text x="35" y="75" class="sub">Breadboard connection map. 3.3 V only. Power off before rewiring.</text>
  <rect x="25" y="105" width="250" height="831" rx="12" class="box"/>
  <rect x="665" y="105" width="595" height="831" rx="12" class="box"/>
  <line x1="280" y1="145" x2="650" y2="145" stroke="blue" stroke-width="5" marker-end="url(#arrow)" /><text x="35" y="151" class="label">ESP32 GPIO23/MOSI</text><text x="675" y="151" class="label">SN74HC595 SER pin 14</text><text x="455" y="135" class="tp">TP1</text><line x1="280" y1="207" x2="650" y2="207" stroke="yellow" stroke-width="5" marker-end="url(#arrow)" /><text x="35" y="213" class="label">ESP32 GPIO18/SCLK</text><text x="675" y="213" class="label">SN74HC595 SRCLK pin 11</text><text x="455" y="197" class="tp">TP2</text><line x1="280" y1="269" x2="650" y2="269" stroke="green" stroke-width="5" marker-end="url(#arrow)" /><text x="35" y="275" class="label">ESP32 GPIO32</text><text x="675" y="275" class="label">SN74HC595 RCLK pin 12</text><text x="455" y="259" class="tp">TP3</text><line x1="280" y1="331" x2="650" y2="331" stroke="red" stroke-width="5" marker-end="url(#arrow)" /><text x="35" y="337" class="label">ESP32 3V3</text><text x="675" y="337" class="label">VCC pin 16 and SRCLR pin 10</text><text x="455" y="321" class="tp">TP4</text><line x1="280" y1="393" x2="650" y2="393" stroke="black" stroke-width="5" marker-end="url(#arrow)" /><text x="35" y="399" class="label">ESP32 GND</text><text x="675" y="399" class="label">GND pin 8 and OE# pin 13</text><text x="455" y="383" class="tp">TP5</text><line x1="280" y1="455" x2="650" y2="455" stroke="orange" stroke-width="5" marker-end="url(#arrow)" /><text x="35" y="461" class="label">SN74HC595 Q0 pin 15</text><text x="675" y="461" class="label">1 kohm + LED0 anode; cathode to GND</text><text x="455" y="445" class="tp">TP6</text><line x1="280" y1="517" x2="650" y2="517" stroke="orange" stroke-width="5" marker-end="url(#arrow)" /><text x="35" y="523" class="label">SN74HC595 Q1 pin 1</text><text x="675" y="523" class="label">1 kohm + LED1 anode; cathode to GND</text><text x="455" y="507" class="tp">TP7</text><line x1="280" y1="579" x2="650" y2="579" stroke="orange" stroke-width="5" marker-end="url(#arrow)" /><text x="35" y="585" class="label">SN74HC595 Q2 pin 2</text><text x="675" y="585" class="label">1 kohm + LED2 anode; cathode to GND</text><text x="455" y="569" class="tp">TP8</text><line x1="280" y1="641" x2="650" y2="641" stroke="orange" stroke-width="5" marker-end="url(#arrow)" /><text x="35" y="647" class="label">SN74HC595 Q3 pin 3</text><text x="675" y="647" class="label">1 kohm + LED3 anode; cathode to GND</text><text x="455" y="631" class="tp">TP9</text><line x1="280" y1="703" x2="650" y2="703" stroke="orange" stroke-width="5" marker-end="url(#arrow)" /><text x="35" y="709" class="label">SN74HC595 Q4 pin 4</text><text x="675" y="709" class="label">1 kohm + LED4 anode; cathode to GND</text><text x="455" y="693" class="tp">TP10</text><line x1="280" y1="765" x2="650" y2="765" stroke="orange" stroke-width="5" marker-end="url(#arrow)" /><text x="35" y="771" class="label">SN74HC595 Q5 pin 5</text><text x="675" y="771" class="label">1 kohm + LED5 anode; cathode to GND</text><text x="455" y="755" class="tp">TP11</text><line x1="280" y1="827" x2="650" y2="827" stroke="orange" stroke-width="5" marker-end="url(#arrow)" /><text x="35" y="833" class="label">SN74HC595 Q6 pin 6</text><text x="675" y="833" class="label">1 kohm + LED6 anode; cathode to GND</text><text x="455" y="817" class="tp">TP12</text><line x1="280" y1="889" x2="650" y2="889" stroke="orange" stroke-width="5" marker-end="url(#arrow)" /><text x="35" y="895" class="label">SN74HC595 Q7 pin 7</text><text x="675" y="895" class="label">1 kohm + LED7 anode; cathode to GND</text><text x="455" y="879" class="tp">TP13</text>

      <text x="35" y="961" class="section">Conceptual rail map — verify the real breadboard with continuity</text>
      <text x="35" y="999" class="label">3V3 rail →</text>
      <line x1="145" y1="993" x2="545" y2="993" stroke="#dc2626" stroke-width="8" marker-end="url(#arrow)"/>
      <line x1="335" y1="981" x2="350" y2="1005" stroke="#ffffff" stroke-width="12"/>
      <text x="270" y="1025" class="warn">possible split — bridge only after continuity test</text>
      <text x="35" y="1063" class="label">GND rail →</text>
      <line x1="145" y1="1057" x2="545" y2="1057" stroke="#111827" stroke-width="8" marker-end="url(#arrow)"/>
      <line x1="335" y1="1045" x2="350" y2="1069" stroke="#ffffff" stroke-width="12"/>
      <rect x="690" y="973" width="255" height="100" rx="10" class="box"/>
      <path d="M790 973 a28 20 0 0 0 56 0" fill="none" stroke="#0f172a" stroke-width="2"/>
      <circle cx="710" cy="1053" r="7" fill="#b45309"/>
      <text x="720" y="1057" class="tp">pin 1 / polarity mark</text>
      <text x="965" y="1003" class="label">orientation: notch/dot</text>
      <text x="965" y="1028" class="label">must match datasheet</text>
      <text x="690" y="1106" class="label">C1 100 nF: place directly across target VCC-GND pins</text>

  <text x="35" y="1151" class="sub">Wire colour is a convention, never evidence. Confirm nodes with continuity and voltage measurements.</text>
</svg>
