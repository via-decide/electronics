<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Sovereign Cartridge Proto-0 Task 4 SPI ownership</title>
  <desc id="desc">Design-only flow from typed clients through one serialized payload-storage owner to SPI0 and the W25Q256JVEIQ, with bounded mutation and recovery states.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#e11d48"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.client{fill:#e0f2fe;stroke:#0284c7;stroke-width:3}.queue{fill:#f5f3ff;stroke:#7c3aed;stroke-width:3}.owner{fill:#ecfdf5;stroke:#059669;stroke-width:3}.bus{fill:#fff7ed;stroke:#ea580c;stroke-width:3}.flash{fill:#fefce8;stroke:#ca8a04;stroke-width:3}.fault{fill:#fff1f2;stroke:#e11d48;stroke-width:3}.state{fill:#f8fafc;stroke:#64748b;stroke-width:2}.wire{fill:none;stroke:#334155;stroke-width:4;marker-end:url(#arrow)}.faultwire{fill:none;stroke:#e11d48;stroke-width:4;marker-end:url(#red-arrow)}.h1{font:700 32px Inter,Arial,sans-serif;fill:#0f172a}.h2{font:700 20px Inter,Arial,sans-serif;fill:#0f172a}.stateh{font:700 16px Inter,Arial,sans-serif;fill:#0f172a}.body{font:16px Inter,Arial,sans-serif;fill:#334155}.small{font:14px Inter,Arial,sans-serif;fill:#475569}.tag{font:700 13px Inter,Arial,sans-serif;letter-spacing:1px;fill:#be123c}.center{text-anchor:middle}
    </style>
  </defs>
  <rect class="bg" width="1500" height="900"/>
  <text class="h1" x="70" y="62">Task 4 · SPI interface and exclusive ownership</text>
  <text class="tag" x="1235" y="58">DESIGN ONLY · GATE OPEN</text>

  <rect class="client" x="65" y="130" width="240" height="170" rx="16"/>
  <text class="h2 center" x="185" y="172">Typed callers</text>
  <text class="body center" x="185" y="210">filesystem · recovery · USB</text>
  <text class="body center" x="185" y="240">no direct SPI access</text>
  <text class="small center" x="185" y="270">ISR and other core submit only</text>

  <rect class="queue" x="365" y="130" width="240" height="170" rx="16"/>
  <text class="h2 center" x="485" y="172">Request queue</text>
  <text class="body center" x="485" y="210">depth 8 · typed bounds</text>
  <text class="body center" x="485" y="240">one request in flight</text>
  <text class="small center" x="485" y="270">queued cancellation only</text>

  <rect class="owner" x="665" y="105" width="300" height="220" rx="16"/>
  <text class="h2 center" x="815" y="150">PAYLOAD_STORAGE_SERVICE</text>
  <text class="body center" x="815" y="188">exclusive SPI0 + CS owner</text>
  <text class="body center" x="815" y="218">bounds · WEL · timeout</text>
  <text class="body center" x="815" y="248">BUSY poll · full verify</text>
  <text class="small center" x="815" y="282">no automatic mutation retry</text>

  <rect class="bus" x="1025" y="105" width="235" height="220" rx="16"/>
  <text class="h2 center" x="1142" y="150">RP2354A · SPI0</text>
  <text class="body center" x="1142" y="188">GPIO16 CIPO</text>
  <text class="body center" x="1142" y="216">GPIO17 manual CS_N</text>
  <text class="body center" x="1142" y="244">GPIO18 SCK · GPIO19 COPI</text>
  <text class="small center" x="1142" y="282">Mode 0 · 24 MHz ceiling</text>

  <rect class="flash" x="1315" y="105" width="150" height="220" rx="16"/>
  <text class="h2 center" x="1390" y="150">Payload NOR</text>
  <text class="body center" x="1390" y="190">W25Q256JV</text>
  <text class="body center" x="1390" y="222">32 MiB</text>
  <text class="small center" x="1390" y="256">EF 40 19</text>
  <text class="small center" x="1390" y="282">4-byte opcodes</text>

  <path class="wire" d="M305 215 L365 215"/>
  <path class="wire" d="M605 215 L665 215"/>
  <path class="wire" d="M965 215 L1025 215"/>
  <path class="wire" d="M1260 215 L1315 215"/>

  <rect class="panel" x="65" y="390" width="645" height="180" rx="16"/>
  <text class="h2" x="95" y="432">Allowed mutation envelope</text>
  <text class="body" x="95" y="470">Program: 1–256 bytes, one page · opcode 12</text>
  <text class="body" x="95" y="502">Erase: 4 KiB aligned / 64 KiB aligned · opcodes 21 / DC</text>
  <text class="body" x="95" y="534">Success: BUSY=0 · WEL=0 · complete target read-back</text>

  <rect class="fault" x="770" y="390" width="695" height="180" rx="16"/>
  <text class="h2" x="800" y="432">Fail-closed boundary</text>
  <text class="body" x="800" y="470">Forbidden: chip erase · 24-bit array access · status writes · Quad/QPI</text>
  <text class="body" x="800" y="502">Reset or timeout during mutation → UNKNOWN_OPERATION_OUTCOME</text>
  <text class="body" x="800" y="534">Recovery probes status; it never replays the mutation automatically</text>

  <rect class="state" x="65" y="650" width="155" height="105" rx="14"/>
  <text class="stateh center" x="142" y="693">UNINITIALIZED</text>
  <text class="small center" x="142" y="725">CS high · delays</text>

  <rect class="state" x="265" y="650" width="140" height="105" rx="14"/>
  <text class="stateh center" x="335" y="693">PROBING</text>
  <text class="small center" x="335" y="725">ID + status</text>

  <rect class="state" x="450" y="650" width="120" height="105" rx="14"/>
  <text class="stateh center" x="510" y="693">IDLE</text>
  <text class="small center" x="510" y="725">CS high</text>

  <rect class="state" x="615" y="650" width="145" height="105" rx="14"/>
  <text class="stateh center" x="687" y="693">ACQUIRED</text>
  <text class="small center" x="687" y="725">one frame</text>

  <rect class="state" x="805" y="650" width="150" height="105" rx="14"/>
  <text class="stateh center" x="880" y="693">WAIT_BUSY</text>
  <text class="small center" x="880" y="725">bounded poll</text>

  <rect class="state" x="1000" y="650" width="125" height="105" rx="14"/>
  <text class="stateh center" x="1062" y="693">VERIFY</text>
  <text class="small center" x="1062" y="725">full read-back</text>

  <rect class="fault" x="1170" y="635" width="135" height="135" rx="14"/>
  <text class="stateh center" x="1237" y="688">RECOVER</text>
  <text class="small center" x="1237" y="720">no replay</text>
  <text class="small center" x="1237" y="744">probe again</text>

  <rect class="fault" x="1350" y="635" width="115" height="135" rx="14"/>
  <text class="stateh center" x="1407" y="685">FAULT</text>
  <text class="stateh center" x="1407" y="710">LOCKED</text>
  <text class="small center" x="1407" y="742">diagnostics</text>

  <path class="wire" d="M220 702 L265 702"/>
  <path class="wire" d="M405 702 L450 702"/>
  <path class="wire" d="M570 702 L615 702"/>
  <path class="wire" d="M760 702 L805 702"/>
  <path class="wire" d="M955 702 L1000 702"/>
  <path class="faultwire" d="M1125 702 L1170 702"/>
  <path class="faultwire" d="M1305 702 L1350 702"/>

  <text class="small" x="65" y="840">Boot XIP remains on the in-package QSPI bus. Task 4 governs only the physically separate payload NOR on SPI0.</text>
</svg>
