<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Sovereign Cartridge Proto-0 topology</title>
  <desc id="desc">USB-C service and power feed an RP2354A A4 controller, separate boot and payload NOR devices, SWD debug and test access. Hardware remains disabled.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 30px sans-serif; fill: #0f172a; }
      .subtitle { font: 16px sans-serif; fill: #475569; }
      .box { rx: 14; stroke-width: 2; }
      .label { font: 700 18px sans-serif; fill: #0f172a; text-anchor: middle; }
      .detail { font: 14px sans-serif; fill: #334155; text-anchor: middle; }
      .edge { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .power { fill: none; stroke: #dc2626; stroke-width: 3; marker-end: url(#arrow); }
      .note { font: 700 15px sans-serif; fill: #991b1b; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="52" class="title" text-anchor="middle">Sovereign Cartridge Proto-0</text>
  <text x="600" y="82" class="subtitle" text-anchor="middle">Task 1 topology freeze · DESIGN_ONLY · no bench claims</text>

  <rect x="60" y="250" width="210" height="130" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="165" y="290" class="label">USB-C service</text>
  <text x="165" y="320" class="detail">USB 2.0 UFP/device</text>
  <text x="165" y="345" class="detail">5 V sink only · no PD</text>

  <rect x="345" y="120" width="235" height="120" class="box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="462" y="160" class="label">Power conditioning</text>
  <text x="462" y="190" class="detail">5 V → regulated 3.3 V</text>
  <text x="462" y="215" class="detail">circuit deferred to Task 3</text>

  <rect x="345" y="285" width="235" height="145" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="462" y="325" class="label">RP2354A · A4</text>
  <text x="462" y="355" class="detail">QFN-60 · controller</text>
  <text x="462" y="380" class="detail">USB + storage transactions</text>
  <text x="462" y="405" class="detail">internal 1.1 V core rail</text>

  <rect x="680" y="120" width="255" height="120" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="807" y="160" class="label">Boot NOR</text>
  <text x="807" y="190" class="detail">2 MiB W25Q16JVWI</text>
  <text x="807" y="215" class="detail">inside RP2354A package</text>

  <rect x="680" y="300" width="255" height="130" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="807" y="340" class="label">Payload NOR</text>
  <text x="807" y="370" class="detail">W25Q256JVEIQ · 32 MiB</text>
  <text x="807" y="395" class="detail">dedicated user-SPI path</text>

  <rect x="345" y="515" width="235" height="105" class="box" fill="#e2e8f0" stroke="#475569"/>
  <text x="462" y="555" class="label">SWD / recovery</text>
  <text x="462" y="585" class="detail">SWDIO · SWCLK · RUN</text>

  <rect x="680" y="515" width="255" height="105" class="box" fill="#e2e8f0" stroke="#475569"/>
  <text x="807" y="555" class="label">Test access</text>
  <text x="807" y="585" class="detail">rails · USB · payload SPI</text>

  <path d="M270 285 C305 235 320 190 345 180" class="power"/>
  <path d="M270 330 L345 350" class="edge"/>
  <path d="M462 240 L462 285" class="power"/>
  <path d="M580 335 C620 280 635 205 680 180" class="edge"/>
  <path d="M580 375 L680 365" class="edge"/>
  <path d="M462 515 L462 430" class="edge"/>
  <path d="M807 515 L807 430" class="edge"/>

  <text x="600" y="675" class="note">Real hardware and destructive writes remain disabled until Tasks 2–6 and bring-up authorization pass.</text>
</svg>
